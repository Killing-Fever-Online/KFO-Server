[tool.ruff]
target-version = "py312"
line-length = 120  # only if you add E501 to select below

[tool.ruff.lint]
select = [
  "E9",   # pycodestyle: syntax-ish errors (E901 tokenize errors, E902 IO errors, etc.)
  "F63",  # pyflakes: invalid comparison / assertion patterns (F631, F632, F633, ...)
  "F7",   # pyflakes: syntax-flow errors (F701 break outside loop, F702 continue
          #           outside loop, F706 return outside function, F707 except after
          #           bare except, F722 forward-annotation syntax, ...)
  "F82",  # pyflakes: undefined names / unused annotations (F821 undefined name,
          #           F822 undefined name in __all__, F823 local var before assignment,
          #           F841 unused local variable, ...)
  "S102", # flake8-bandit: exec() usage — banned for the same reason as eval()
  "S307", # flake8-bandit: eval() usage — banned because input is untrusted
  "E501", # 
]
